# ClipCraft — Snap packaging for the Snap Store (Ubuntu App Center)
# ---------------------------------------------------------------------------
# Placement in the repo:  snap/snapcraft.yaml   (this file)
#                         snap/gui/clipcraft.desktop
#                         snap/gui/icon.png        (512x512, from build/icon.png)
#                         snap/local/launcher.sh
#
# Verified against the source tree on 2026-11-09:
#   package.json version 1.1.6, Electron 33, React + Vite, ffmpeg-static,
#   ffprobe-static, onnxruntime-node (all asar-unpacked, same as the .deb).
# The release difference is reused, not reinvented: the build runs
# scripts/prepare-release-config.cjs, so the Snap is the LIGHT build
# (no bundled content pack), exactly like the GitHub Release installers.
#
# BEFORE FIRST UPLOAD — 3 things only Hamza can do/decide:
#   1. Create the developer account on snapcraft.io and register the name
#      `clipcraft` (see ../PUBLISH-GUIDE.md). If the name is taken, change
#      `name:` below AND the desktop file name stays the same.
#   2. Apply the updater gate patch (SNAP-UPDATER-PATCH.md): inside a Snap,
#      updates are delivered by snapd — ClipCraft's own "download a .deb and
#      pkexec-install it" flow can never work under confinement and must
#      answer "updates come from the Snap Store" instead.
#   3. Run the test checklist in PUBLISH-GUIDE.md on a real Ubuntu machine
#      (launch, import, export, screen/camera record) BEFORE releasing to
#      the stable channel. Upload to beta/edge first.
# ---------------------------------------------------------------------------

name: clipcraft
title: ClipCraft
version: '1.1.6'
summary: Free desktop video editor — no watermark, no account, no subscription
description: |
  ClipCraft is a free, open-source desktop video editor and covers what
  people actually open an editor for: multi-track cutting, transitions and
  effects, animated titles, auto-captions, templates, stock media and clean
  4K export. With none of the catches: no watermark, no account, no
  subscription, no upload. Your projects and footage stay on your computer,
  and everything — including the template library — works offline.

  Good for: TikTok, Reels and Shorts, YouTube videos, tutorials and screen
  recordings, podcast clips.
license: MIT
# Reuse the icon already in the repo (512x512) — no new binary file is
# added for the Snap; snapcraft copies this to meta/gui/icon.png, which
# the desktop file in snap/gui/ references.
icon: build/icon.png
website: https://clipcrafts.pages.dev
contact: mailto:hamzaabika2@gmail.com
source-code: https://github.com/hamzaabika/clipcraft
issues: https://github.com/hamzaabika/clipcraft/issues

# core24 = Ubuntu 24.04 base, pairs with the GNOME 46 runtime that the
# gnome extension below pulls in — the same generation ClipCraft 1.1.6
# is developed and tested against.
base: core24
confinement: strict
grade: stable

# First submission is amd64-only, on purpose: ffmpeg-static / onnxruntime
# ship per-arch binaries and the arm64 path is untested (same class of
# problem as the known Intel-Mac ffmpeg caveat). Add arm64 only after a
# real arm64 test pass.
architectures:
  - build-on: [amd64]
    build-for: [amd64]

apps:
  clipcraft:
    # Direct binary launch (the linux-unpacked executable is named
    # `clipcraft`, verified from the shipped .deb payload). No wrapper
    # script: the repo is synced to GitHub as text snapshots, which do not
    # preserve executable file modes — the environment fixes a wrapper
    # would set live in the `environment:` stanza below instead.
    command: clipcraft
    desktop: snap/gui/clipcraft.desktop
    common-id: com.clipcraft.app
    # The gnome extension supplies the desktop plugs (desktop, wayland, x11,
    # opengl, gsettings, ...) and the GTK/chromium runtime libraries.
    extensions: [gnome]
    plugs:
      # Open / save projects and import footage from anywhere in Home —
      # this is the plug the whole editor stands on (file dialogs throughout
      # electron/main.cjs read and write user-chosen paths).
      - home
      # Footage and exports on USB drives / external disks (/media, /mnt).
      - removable-media
      # Optional online features, all user-triggered and key-gated in the
      # app: stock media, audio library, online templates, AI services with
      # the user's own API keys, and help links. Editing itself is offline.
      - network
      # Preview playback and audio export monitoring.
      - audio-playback
      # Microphone for voiceover and for screen recording with mic
      # (src/components/ScreenRecordDialog.jsx).
      - audio-record
      # Camera bubble for screen recordings
      # (electron/cambubble.js uses getUserMedia video).
      - camera
    environment:
      # Snap already confines the app with AppArmor/seccomp; Chromium's own
      # setuid sandbox helper cannot run inside that, so — as with most
      # strict-confinement Electron snaps — the inner sandbox is disabled
      # and the Snap sandbox is the boundary.
      ELECTRON_DISABLE_SANDBOX: '1'
      # Keep Electron's userData inside the Snap's writable area
      # ($SNAP_USER_DATA = ~/snap/clipcraft/current), never the real
      # ~/.config — snapd sets HOME there already; this is belt-and-braces
      # for the XDG-based paths Electron derives config dirs from.
      XDG_CONFIG_HOME: $SNAP_USER_DATA/.config

parts:
  clipcraft:
    plugin: nil
    source: .
    source-type: local
    build-packages:
      - curl
      - xz-utils
      - git
    override-build: |
      set -eux
      # Node 24 — the same major the release workflow (.github/workflows/
      # release.yml) builds with. core24's archive Node is too old for
      # Vite 6, so the official tarball is used. Bump version + verify the
      # download when Node 24 moves.
      curl -fsSL https://nodejs.org/dist/v24.11.0/node-v24.11.0-linux-x64.tar.xz -o /tmp/node.tar.xz
      tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
      node --version

      # Light release config (content pack excluded) — the repo's own
      # generator, identical to the .deb/.exe/.dmg release pipeline.
      # NOTE: bundled-templates/ must already contain the generated media
      # (on a release branch / CI it comes from the templates job artifact;
      # in this working tree it is already on disk).
      node scripts/prepare-release-config.cjs

      npm ci
      npm run build
      # Unpacked app only — electron-builder assembles the .snap itself in
      # other setups, but here Snapcraft owns the packaging so the plugs
      # and confinement above stay fully explicit and reviewable.
      npx electron-builder --linux dir --x64 --config electron-builder.release.json

      cp -a release/linux-unpacked/. "$CRAFT_PART_INSTALL"/
      # Normalise the launcher binary name to lowercase `clipcraft`
      # (electron-builder names it after the package in most configs, but
      # do not depend on the capitalisation).
      if [ -f "$CRAFT_PART_INSTALL/ClipCraft" ]; then
        mv "$CRAFT_PART_INSTALL/ClipCraft" "$CRAFT_PART_INSTALL/clipcraft"
      fi
      test -x "$CRAFT_PART_INSTALL/clipcraft"
    # Runtime libraries Electron links against that the GNOME platform
    # snap does not guarantee. Confirmed by the ldd step of the test
    # checklist on first build — trim or extend from that evidence, not
    # by guessing.
    stage-packages:
      - libnss3
      - libnspr4
      - libxkbcommon0
      - libasound2t64
      - libdrm2
      - libgbm1
      - libxshmfence1
