name: Attach 2.1.1 deb
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and attach deb from SwissTransfer
        env:
          GH_TOKEN: ${{ github.token }}
          LINK_UUID: 01a1e556-5073-702d-b9f8-d540ded5ae47
          EXPECTED_SHA: 8ceddf40e2f69416e7065e29b7703b04bdb4ff04b67fed0b485f0184cf8ac18d
          EXPECTED_SIZE: "311965020"
        run: |
                    python3 - <<'PY'
                    import re, os, hashlib, subprocess, urllib.request, urllib.error, http.cookiejar, json
                    uuid = os.environ['LINK_UUID']
                    file_uuid = '01a1e556-5076-7016-a86d-d98850dc1c5d'
                    transfer_uuid = '01a1e556-5070-72e0-bf2a-5139c00b6b51'
                    exp_sha = os.environ['EXPECTED_SHA']
                    exp_size = int(os.environ['EXPECTED_SIZE'])
                    cj = http.cookiejar.CookieJar()
                    opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
                    base = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36', 'Accept': 'text/html,application/json', 'Referer': 'https://www.swisstransfer.com/dl/' + uuid}
                    def fetch(url, data=None, ctype=None):
                        h = dict(base)
                        if ctype:
                            h['Content-Type'] = ctype
                        req = urllib.request.Request(url, headers=h, data=data)
                        try:
                            with opener.open(req, timeout=120) as r:
                                return r.status, r.read()
                        except urllib.error.HTTPError as e:
                            return e.code, e.read()
                        except Exception as e:
                            print('ERR', url, e)
                            return None, b''
                    def save_if_deb(body):
                        if body[:8] != b'!<arch>\n':
                            return False
                        h = hashlib.sha256(body)
                        print('  body is deb, size', len(body), 'sha256', h.hexdigest())
                        if len(body) == exp_size and h.hexdigest() == exp_sha:
                            with open('cutflow_2.1.0_amd64.deb', 'wb') as f:
                                f.write(body)
                            print('  VERIFIED')
                            return True
                        print('  mismatch')
                        return False
                    def stream(url):
                        req = urllib.request.Request(url, headers=base)
                        try:
                            with opener.open(req, timeout=120) as r:
                                print('  stream status', r.status, 'len', r.headers.get('Content-Length'), 'type', r.headers.get('Content-Type'))
                                head = r.read(8)
                                if head != b'!<arch>\n':
                                    rest = r.read(400)
                                    print('  not a deb, first bytes:', head, rest[:200])
                                    return False
                                h = hashlib.sha256()
                                h.update(head)
                                size = len(head)
                                with open('cutflow_2.1.0_amd64.deb', 'wb') as f:
                                    f.write(head)
                                    while True:
                                        chunk = r.read(1024 * 1024)
                                        if not chunk:
                                            break
                                        h.update(chunk)
                                        f.write(chunk)
                                        size += len(chunk)
                                print('  downloaded size', size, 'sha256', h.hexdigest())
                                if size == exp_size and h.hexdigest() == exp_sha:
                                    print('  VERIFIED')
                                    return True
                                print('  mismatch, removing')
                                os.remove('cutflow_2.1.0_amd64.deb')
                                return False
                        except Exception as e:
                            print('  ERR', e)
                            return False
                    status, page = fetch('https://www.swisstransfer.com/dl/' + uuid)
                    print('page status', status, 'len', len(page))
                    s, b = fetch('https://www.swisstransfer.com/api/1/links/' + uuid)
                    print('links info', s, b.decode('utf-8', 'ignore')[:2000])
                    ok = False
                    gets = []
                    gets.append('https://www.swisstransfer.com/api/1/download/' + transfer_uuid + '/' + file_uuid)
                    gets.append('https://www.swisstransfer.com/api/1/download/' + transfer_uuid)
                    gets.append('https://www.swisstransfer.com/dl/' + uuid + '?download=1')
                    for url in gets:
                        print('trying GET', url)
                        if stream(url):
                            ok = True
                            break
                    if not ok:
                        bodies = [b'', b'{}', json.dumps({'fileId': file_uuid}).encode(), json.dumps({'file_id': file_uuid}).encode(), json.dumps({'uuid': file_uuid}).encode(), json.dumps({'id': file_uuid}).encode(), json.dumps({'file': file_uuid}).encode(), json.dumps({'link': uuid, 'file': file_uuid}).encode()]
                        for data in bodies:
                            url = 'https://www.swisstransfer.com/api/1/download/' + uuid
                            print('trying POST', url, 'body', data[:80])
                            s, b = fetch(url, data=data, ctype='application/json')
                            print('  post status', s, 'len', len(b), 'head', b[:300])
                            if save_if_deb(b):
                                ok = True
                                break
                            try:
                                j = json.loads(b.decode('utf-8', 'ignore'))
                                print('  json:', j)
                                for u in re.findall(r'https://[A-Za-z0-9._/-]+', json.dumps(j)):
                                    print('  trying url from json', u)
                                    if stream(u):
                                        ok = True
                                        break
                                if ok:
                                    break
                            except Exception as e:
                                print('  not json', e)
                    if not ok:
                        for data in [json.dumps({'fileId': file_uuid}).encode(), json.dumps({'uuid': file_uuid}).encode()]:
                            url = 'https://www.swisstransfer.com/api/1/download'
                            print('trying POST', url, 'body', data[:80])
                            s, b = fetch(url, data=data, ctype='application/json')
                            print('  post status', s, 'len', len(b), 'head', b[:300])
                            if save_if_deb(b):
                                ok = True
                                break
                    if not ok:
                        print('DOWNLOAD FAILED')
                        raise SystemExit(1)
                    v = subprocess.run(['gh', 'release', 'view', 'v2.1.1', '--json', 'tagName,name,isDraft,assets'], capture_output=True, text=True)
                    print(v.stdout)
                    r = subprocess.run(['gh', 'release', 'upload', 'v2.1.1', 'cutflow_2.1.0_amd64.deb', '--clobber'], capture_output=True, text=True)
                    print('gh upload rc', r.returncode)
                    print(r.stdout)
                    print(r.stderr)
                    if r.returncode != 0:
                        raise SystemExit(1)
                    v = subprocess.run(['gh', 'release', 'view', 'v2.1.1', '--json', 'assets'], capture_output=True, text=True)
                    print(v.stdout)
                    print('UPLOAD DONE')
                    PY
