name: Attach 2.1.1 deb
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright and Chromium
        run: python3 -m pip install --quiet --break-system-packages playwright && python3 -m playwright install chromium && sudo python3 -m playwright install-deps chromium
      - name: Download deb in a real browser and attach it
        env:
          GH_TOKEN: ${{ github.token }}
          LINK_UUID: 01a1e556-5073-702d-b9f8-d540ded5ae47
          EXPECTED_SHA: 8ceddf40e2f69416e7065e29b7703b04bdb4ff04b67fed0b485f0184cf8ac18d
          EXPECTED_SIZE: "311965020"
        run: |
                    python3 - <<'PY'
                    import os, hashlib, subprocess
                    from playwright.sync_api import sync_playwright
                    uuid = os.environ['LINK_UUID']
                    exp_sha = os.environ['EXPECTED_SHA']
                    exp_size = int(os.environ['EXPECTED_SIZE'])
                    out = 'cutflow_2.1.0_amd64.deb'
                    with sync_playwright() as p:
                        browser = p.chromium.launch(headless=True)
                        ctx = browser.new_context(accept_downloads=True)
                        page = ctx.new_page()
                        page.goto('https://www.swisstransfer.com/dl/' + uuid, timeout=60000)
                        page.wait_for_timeout(8000)
                        print('title:', page.title())
                        print('buttons:', page.locator('button').all_inner_texts())
                        try:
                            with page.expect_download(timeout=300000) as dl:
                                page.get_by_role('button', name='Download', exact=True).click()
                            download = dl.value
                            print('download url:', download.url)
                            print('download name:', download.suggested_filename)
                            download.save_as(out)
                        except Exception as e:
                            print('DOWNLOAD CLICK FAILED', e)
                            print('page text:', page.locator('body').inner_text()[:2000])
                            raise SystemExit(1)
                        browser.close()
                    h = hashlib.sha256()
                    size = 0
                    with open(out, 'rb') as f:
                        while True:
                            chunk = f.read(1024 * 1024)
                            if not chunk:
                                break
                            h.update(chunk)
                            size += len(chunk)
                    print('downloaded size', size, 'sha256', h.hexdigest())
                    if size != exp_size or h.hexdigest() != exp_sha:
                        print('MISMATCH')
                        raise SystemExit(1)
                    print('VERIFIED')
                    v = subprocess.run(['gh', 'release', 'view', 'v2.1.1', '--json', 'tagName,name,isDraft,assets'], capture_output=True, text=True)
                    print(v.stdout)
                    r = subprocess.run(['gh', 'release', 'upload', 'v2.1.1', out, '--clobber'], capture_output=True, text=True)
                    print('gh upload rc', r.returncode)
                    print(r.stdout)
                    print(r.stderr)
                    if r.returncode != 0:
                        raise SystemExit(1)
                    v = subprocess.run(['gh', 'release', 'view', 'v2.1.1', '--json', 'assets'], capture_output=True, text=True)
                    print(v.stdout)
                    print('UPLOAD DONE')
                    PY
